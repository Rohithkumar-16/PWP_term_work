{% extends "base.html" %}
{% block title %}Create Account — The Halcyon Hotel{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-14">
  <div class="bg-white border border-stone-200 rounded-2xl p-7 shadow-sm">
    <h1 class="font-display text-2xl font-bold text-stone-900">Create guest account</h1>
    <p class="text-sm text-stone-600 mt-1">Book suites in seconds and manage stays online.</p>

    <form method="POST" action="{{ url_for('auth.register') }}" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div>
        <label for="reg-name" class="block text-xs font-semibold text-stone-700 mb-1">Full Name</label>
        <input id="reg-name" name="full_name" type="text" required minlength="2" class="w-full px-3.5 py-2.5 text-sm border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Maya Lin" />
      </div>

      <div>
        <label for="reg-email" class="block text-xs font-semibold text-stone-700 mb-1">Email Address</label>
        <input id="reg-email" name="email" type="email" required class="w-full px-3.5 py-2.5 text-sm border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="you@example.com" />
      </div>

      <div>
        <label for="reg-password" class="block text-xs font-semibold text-stone-700 mb-1">Password (min 8 chars)</label>
        <input id="reg-password" name="password" type="password" required minlength="8" class="w-full px-3.5 py-2.5 text-sm border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" />
      </div>

      <div>
        <label for="reg-confirm" class="block text-xs font-semibold text-stone-700 mb-1">Confirm Password</label>
        <input id="reg-confirm" name="confirm_password" type="password" required minlength="8" class="w-full px-3.5 py-2.5 text-sm border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" />
      </div>

      <button type="submit" class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white text-sm font-semibold rounded-xl transition-colors">
        Create Guest Account
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-stone-600">
      Already registered? <a href="{{ url_for('auth.login') }}" class="font-semibold text-blue-700 hover:underline">Sign in</a>
    </p>
  </div>
</section>
{% endblock %}
