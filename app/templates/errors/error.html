{% extends "base.html" %}
{% block title %}{{ status_code }} {{ title }} — The Halcyon Hotel{% endblock %}

{% block content %}
<section class="max-w-lg mx-auto px-4 py-20 text-center">
  <div class="bg-white border border-stone-200 rounded-2xl p-8 shadow-sm">
    <p class="font-mono text-sm font-semibold text-orange-600">Error {{ status_code }}</p>
    <h1 class="font-display text-3xl font-bold text-stone-900 mt-2">{{ title }}</h1>
    <p class="text-sm text-stone-600 mt-3 leading-relaxed">{{ message }}</p>
    <a href="{{ url_for('main.index') }}" class="inline-block mt-6 px-5 py-2.5 bg-blue-700 hover:bg-blue-800 text-white text-xs font-semibold rounded-xl transition-colors">
      Return to Hotel Catalog
    </a>
  </div>
</section>
{% endblock %}
